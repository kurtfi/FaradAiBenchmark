version: "1.0"
category: "PATH_TRAVERSAL"
description: "Rules detecting directory traversal, path escape sequences, and direct sensitive file path targets."
rules:
  - id: "TRAVERSAL-DOT-DOT"
    name: "Relative Path Traversal Sequence"
    threat_domain: "PATH_TRAVERSAL"
    cwe: "CWE-22"
    severity: "CRITICAL"
    regex: '(?:\.\.[/\\])+'
    description: "Detects standard ../ or ..\\ path escaping sequences."

  - id: "TRAVERSAL-ENCODED"
    name: "URL / Hex Encoded Traversal"
    threat_domain: "PATH_TRAVERSAL"
    cwe: "CWE-22"
    severity: "HIGH"
    regex: '(?i)(?:%2e%2e[%2f%5c]|%252e%252e|\.\.%2f|\.\.%5c|\.\.%c0%af)'
    description: "Detects URL-encoded, double-encoded, or UTF-8 overlong directory traversal patterns."

  - id: "TRAVERSAL-SENSITIVE-UNIX"
    name: "Direct Sensitive Unix File Path"
    threat_domain: "PATH_TRAVERSAL"
    cwe: "CWE-22"
    severity: "CRITICAL"
    regex: '(?i)/(?:etc/(?:[a-z0-9_.-]+/)*[a-z0-9_.-]+|var/(?:log|spool)/(?:[a-z0-9_.-]+/)*[a-z0-9_.-]+|proc/(?:self|sys|version|\d+)/|var/run/secrets|root/\.ssh/|usr/local/(?:etc|logs|bin)/)'
    description: "Detects direct references to sensitive Unix configuration (/etc), logs (/var/log), process environments (/proc), and secrets."

  - id: "TRAVERSAL-WINDOWS-SYSTEM"
    name: "Windows Sensitive System & Server Path"
    threat_domain: "PATH_TRAVERSAL"
    cwe: "CWE-22"
    severity: "CRITICAL"
    regex: '(?i)[A-Za-z]:[/\\](?:windows|winnt|xampp|wamp|inetpub|program\s+files(?:\s*\(x86\))?)(?:[/\\]|$)'
    description: "Detects attempts to access Windows system directories, SAM, registry hives, or local web server roots."
