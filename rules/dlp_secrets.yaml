version: "1.0"
category: "DLP_SECRETS"
description: "Data Loss Prevention rules detecting high-entropy credentials, API keys, tokens, and personal data."
rules:
  - id: "DLP-OPENAI-KEY"
    name: "OpenAI Secret Key Leakage"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "HIGH"
    regex: '(?i)(?:sk-proj-|sk-live-|sk-)[a-zA-Z0-9_-]{20,}'
    description: "Detects exposed OpenAI API secret keys."

  - id: "DLP-GITHUB-PAT"
    name: "GitHub Personal Access Token"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "CRITICAL"
    regex: '(?i)\b(?:ghp_[a-zA-Z0-9]{20,45}|github_pat_[a-zA-Z0-9_]{30,})\b'
    description: "Detects GitHub classic and fine-grained personal access tokens."

  - id: "DLP-AWS-ACCESS-KEY"
    name: "AWS Access Key ID"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "HIGH"
    regex: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16,24}\b'
    description: "Detects standard AWS Access Key IDs (AKIA, ASIA, ABIA)."

  - id: "DLP-AWS-SECRET-KEY"
    name: "AWS Secret Access Key"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "CRITICAL"
    regex: '(?i)(?:aws_secret_access_key|aws_secret_key)\s*[:=]\s*[''"]?[a-zA-Z0-9/+=]{40}[''"]?'
    description: "Detects exposed AWS Secret Access Key pairs."

  - id: "DLP-SLACK-TOKEN"
    name: "Slack API Token"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "HIGH"
    regex: '\bxox[baprs]-[0-9a-zA-Z-]{20,}\b'
    description: "Detects Slack bot, app, and user OAuth access tokens."

  - id: "DLP-STRIPE-KEY"
    name: "Stripe Live Secret Key"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "CRITICAL"
    regex: '\bsk_live_[0-9a-zA-Z]{24,}\b'
    description: "Detects live production Stripe API secret keys."

  - id: "DLP-GOOGLE-API-KEY"
    name: "Google Cloud API Key"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "HIGH"
    regex: '\bAIza[0-9A-Za-z-_]{35}\b'
    description: "Detects standard Google Cloud Platform API keys."

  - id: "DLP-PRIVATE-KEY"
    name: "Private RSA/SSH Key"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-312"
    severity: "CRITICAL"
    regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
    description: "Detects plaintext asymmetric private cryptographic keys."

  - id: "DLP-JWT-TOKEN"
    name: "JSON Web Token (JWT)"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-532"
    severity: "MEDIUM"
    regex: '\beyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\b'
    description: "Detects exposed signed JWT authorization bearer tokens."

  - id: "DLP-DB-CONNECTION-URI"
    name: "Database Connection URI with Credentials"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-312"
    severity: "HIGH"
    regex: '(?:postgres|postgresql|mysql|mongodb|redis):\/\/[a-zA-Z0-9_.-]+:[^@\s]+@[a-zA-Z0-9_.-]+'
    description: "Detects plaintext database credentials embedded in connection URIs."

  - id: "DLP-US-SSN"
    name: "US Social Security Number"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-359"
    severity: "HIGH"
    regex: '\b\d{3}-\d{2}-\d{4}\b'
    description: "Detects US Social Security Numbers formatted with dashes."

  - id: "DLP-CREDIT-CARD"
    name: "Credit Card Number"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-359"
    severity: "CRITICAL"
    regex: '\b(?:\d{4}[-\s]?){3}\d{4}\b'
    description: "Detects 16-digit credit card numbers."

  - id: "DLP-GOVERNMENT-ID"
    name: "Government ID / Passport (MCPTox Pattern)"
    threat_domain: "DATA_LEAK"
    cwe: "CWE-359"
    severity: "MEDIUM"
    regex: '(?i)(?:passenger_id|government_id|id_number)[\"''\s]*[:=][\"''\s]*\d{9}\b'
    description: "Detects 9-digit government identification numbers in tool parameters."
